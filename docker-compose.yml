services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: http://localhost
      WEATHER_API_BASE_URL: https://api.open-meteo.com/v1
      WEATHER_GEOCODING_BASE_URL: https://geocoding-api.open-meteo.com/v1
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend
